<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELKO COMPRESSORES LTDA</title>
    <style>
        *{
            margin:0;padding:0;box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif
        }
        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;display:flex;justify-content:center;
            align-items:center;padding:20px
        }
        .card{
            width:100%;max-width:450px;
            background:#fff;
            border-radius:20px;padding:35px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.2)
        }
        .logo{
            width:120px;
            height:120px;
            margin:0 auto 20px;
            border-radius:50%;
            object-fit:contain;
            border:4px solid #e5e7eb
        }

        h1{
            color:#111827;
            margin-bottom:10px;
            font-size: medium;
        }
        .descricao{
            color:#6b7280;
            margin-bottom:25px;
            line-height:1.5;
            font-size: small;

        }
        .endereco{
            color:#093168; 
            margin-bottom:20px; 
            line-height:1.5
        }


        .btn{
            display:block;
            text-decoration:none;
            color:white;padding:15px;
            margin:12px 0;border-radius:12px;
            font-weight:bold;
            transition:.3s
        }
        .btn:hover{
            transform:translateY(-3px);
            opacity:.9
        }
        .site{
            background:#2563eb
        }
        .whatsapp{
            background:#25D366
        }
        .instagram{
            background:#E1306C
        }
        .linkedin{
            background:#0077B5
        }
        .email{
            background:#6b7280
        }
        footer{
            margin-top:20px;
            color:#9ca3af;
            font-size:12px
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Logo_Laranja.jpg" alt="Logo" class="logo">
        <h1>VELKO COMPRESSORES</h1>
        <p class="descricao">Remanufatura de compressores </p>
        <p class="endereco">📍 Rua Sargento Silva Nunes, 254 | Ramos – Rio de Janeiro, RJ </p>
            
        <a href="https://velko.com.br/" class="btn site" target="_blank">🌐 Site</a>
        <a href="https://wa.me/552125946544" class="btn whatsapp" target="_blank">📱 WhatsApp</a>
        <a href="https://instagram.com/velkocompressores/" class="btn instagram" target="_blank">📷 Instagram</a>
        <a href="https://linkedin.com/company/velko-compressores/" class="btn linkedin" target="_blank">💼 LinkedIn</a>
        <a href="mailto:comercial@velko.com.br" class="btn email">✉️ E-mail</a>

        <footer>© 2026 Velko Compressores Ltda.</footer>
    </div>
</body>
</html>
